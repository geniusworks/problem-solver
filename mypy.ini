[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_optional = True

# Per-module options.
#
# These sections must use the "mypy-<module>" form. They were previously written
# as "[mypy.anthropic.*]" (a dot instead of a hyphen), which mypy silently ignores,
# so ignore_missing_imports was never applied to any third-party package.
[mypy-anthropic.*]
ignore_missing_imports = True

[mypy-openai.*]
ignore_missing_imports = True

[mypy-aiohttp.*]
ignore_missing_imports = True

[mypy-bs4.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True

[mypy-psutil.*]
ignore_missing_imports = True

[mypy-radon.*]
ignore_missing_imports = True

[mypy-autopep8.*]
ignore_missing_imports = True

[mypy-black.*]
ignore_missing_imports = True

[mypy-pylint.*]
ignore_missing_imports = True
