# Default hardware profiles - can be overridden by environment variables
profiles:
  m1_16gb:
    max_model_size: 13
    concurrent_models: 1
    gpu_memory_utilization: 70
    cpu_thread_count: 8
    metal_enabled: true
  
  m2_32gb:
    max_model_size: 33
    concurrent_models: 2
    gpu_memory_utilization: 80
    cpu_thread_count: 12
    metal_enabled: true
    
  base:  # Fallback profile for unknown hardware
    max_model_size: 7
    concurrent_models: 1
    gpu_memory_utilization: 50
    cpu_thread_count: 4
    metal_enabled: false
