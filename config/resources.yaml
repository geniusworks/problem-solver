# Default resource limits - can be overridden by environment variables
execution:
  timeout_seconds: 60  # Default execution timeout
  max_memory_mb: 8192  # Per-process memory cap: RLIMIT_AS on Linux, a physical-footprint watchdog everywhere (shared/sandbox.py)
  max_processes: 1    # Default process limit
  deny_network: false # Run model-written code under a no-network sandbox profile (shared/sandbox.py); DENY_NETWORK overrides

requests:
  timeout_seconds: 60  # Default API request timeout
  max_retries: 3      # Default retry count
  rate_limit_delay: 1 # Default delay between requests in seconds

cache:
  problem_cache:
    enabled: true
    max_age_days: 7
  solution_cache:
    enabled: true
    max_attempts: 100

submission:
  enabled: false  # Default submission behavior, can be overridden by SUBMIT_SOLUTIONS env var
  # The budget (submission/policy.py, Budget): the AoC 2026 registration's decision 4.
  wrong_per_part: 3         # wrong answers per part over the whole event, all models and trials
  per_night: 6              # posts across all parts ...
  night_hours: 20           # ... in any window this long
  wait_margin_seconds: 30   # added to every wait AoC states
  longest_wait_seconds: 900 # a longer wait ends the step for the night
