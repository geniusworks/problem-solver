# Default model configurations - can be overridden by environment variables
defaults:
  temperature: 0.1
  max_tokens: 2000
  timeout_seconds: 60

models:
  codellama:7b:
    size: 7
    context_length: 4096
    default_temperature: 0.1
    max_tokens: 2000
    timeout_seconds: 60
    capabilities:
      - code_generation
      - code_review
      - validation
      
  codellama-13b-instruct:
    size: 13
    context_length: 4096
    default_temperature: 0.1
    max_tokens: 2000
    timeout_seconds: 60
    capabilities:
      - code_generation
      - code_review
      - validation
      
  gpt-4:
    size: 0  # Cloud model
    context_length: 8192
    default_temperature: 0.1
    max_tokens: 2000
    timeout_seconds: 60
    capabilities:
      - code_generation
      - code_review
      - validation
      - planning
