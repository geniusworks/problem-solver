# requirements.txt and requirements-dev.txt state what the code needs; this file
# pins what it ran on. Several of these sit on the measurement path: beautifulsoup4
# turns puzzle pages into prompts, autopep8 and black rewrite every candidate, and
# pylint, radon and black score the quality tie-break between candidates.
