# Runs on every push and pull request. Needs no models and no AoC data: tests that
# read years/ (gitignored) skip, and the published figures are checked against the
# committed tables in dev/results/.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the measured versions
        run: python -m pip install -r requirements.lock
      - name: The lock satisfies requirements*.txt
        run: |
          if python -m pip install --dry-run -r requirements.txt -r requirements-dev.txt | grep -q "Would install"; then
            echo "requirements.lock is out of date with requirements*.txt; regenerate it (see its header)." >&2
            exit 1
          fi
      - name: Tests
        run: PYTHONPATH=. python -m pytest -q
      - name: Type check
        run: python -m mypy shared learning submission experiment.py solve.py dev/export_results.py dev/recompute_results.py
      - name: Published figures match the committed results
        run: python dev/recompute_results.py --check
