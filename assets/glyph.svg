<svg width="60" height="56" viewBox="0 0 60 56" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Problem Solver glyph">
  <!-- converging draws: several attempts fan in toward one verified answer -->
  <path d="M13 9 C 26 9, 30 22, 36 26" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <path d="M13 28 L 36 28" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M13 47 C 26 47, 30 34, 36 30" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- the attempts (one succeeds) -->
  <circle cx="8" cy="9" r="5" fill="none" stroke="#10b981" stroke-width="3"/>
  <circle cx="8" cy="28" r="5" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="8" cy="47" r="5" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <!-- the oracle: one verified answer -->
  <circle cx="47" cy="28" r="11" fill="#10b981"/>
  <path d="M42 28 L 45.5 31.5 L 52 21" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
